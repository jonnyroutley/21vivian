openapi: 3.0.0
info:
  title: API
  version: '1.0'
servers:
- url: http://0.0.0.0:8000
tags:
- name: Car
- name: Chat
- name: Event
- name: Info
- name: Notify
- name: Review
- name: Upload
paths:
  /reviews:
    post:
      tags:
      - Review
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/InputModel'
        required: true
      responses:
        '201':
          description: Returns when the review is successfully created.
        '400':
          description: The user has sent bad data.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Issue adding the review to the database.
    get:
      tags:
      - Review
      responses:
        '201':
          description: Returns when the review is successfully created.
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        '500':
          description: Likely an issue with the database connection.
  /events:
    get:
      tags:
      - Event
      responses:
        '200':
          description: Returns a list of the events
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventDto'
        '500':
          description: Likely an issue with the database connection.
    post:
      tags:
      - Event
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/CreateEventInput'
        required: true
      responses:
        '200':
          description: Returns a list of the events
        '500':
          description: Likely an issue with the database connection.
  /events/attendee:
    post:
      tags:
      - Event
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/AttendeeInputModel'
        required: true
      responses:
        '200':
          description: Returns a list of the events
        '500':
          description: Likely an issue with the database connection.
  /car/bookings:
    get:
      tags:
      - Car
      responses:
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarBookingDto'
        '500':
          description: ''
    post:
      tags:
      - Car
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/CreateBookingInput'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CarBookingDto'
        '409':
          description: The booking clashes with an existing one, or the dates are invalid.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CarErrorMessage'
        '400':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CarErrorMessage'
        '500':
          description: ''
  /car/bookings/{id}:
    get:
      tags:
      - Car
      parameters:
      - name: id
        schema:
          type: integer
          format: int32
        in: path
        required: true
        deprecated: false
        explode: true
      responses:
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CarBookingDto'
        '404':
          description: ''
        '500':
          description: ''
  /car/bookings/{id}/complete:
    post:
      tags:
      - Car
      parameters:
      - name: id
        schema:
          type: integer
          format: int32
        in: path
        required: true
        deprecated: false
        explode: true
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/CompleteBookingInput'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CarBookingDto'
        '404':
          description: ''
        '400':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CarErrorMessage'
        '500':
          description: ''
  /upload/presigned-link/{object}:
    get:
      tags:
      - Upload
      parameters:
      - name: object
        schema:
          type: string
        in: path
        required: true
        deprecated: false
        explode: true
      responses:
        '200':
          description: Returns a list of the events
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/PresignedLinkDto'
        '500':
          description: Likely an issue with the database connection.
  /upload:
    post:
      tags:
      - Upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - upload
              properties:
                upload:
                  type: string
                  format: binary
        required: true
      responses:
        '200':
          description: Returns a list of the events
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/UploadImageDto'
        '500':
          description: Likely an issue with the database connection.
  /info:
    get:
      tags:
      - Info
      responses:
        '200':
          description: Returns the last deployment time
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /notify:
    post:
      tags:
      - Notify
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
        required: true
      responses:
        '200':
          description: Returns a list of the events
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '500':
          description: Likely an issue with the database connection.
  /chat:
    post:
      tags:
      - Chat
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/ChatInput'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChatDto'
  /chat/{housemate}:
    post:
      tags:
      - Chat
      parameters:
      - name: housemate
        schema:
          $ref: '#/components/schemas/Housemate'
        in: path
        required: true
        deprecated: false
        explode: true
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/ChatInput'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChatDto'
components:
  schemas:
    Attendee:
      type: object
      required:
      - id
      - event_id
      - name
      - created_at
      properties:
        id:
          type: integer
          format: int32
        event_id:
          type: integer
          format: int32
        name:
          type: string
        created_at:
          type: string
          format: naive-date-time
    AttendeeInputModel:
      type: object
      required:
      - name
      - event_id
      properties:
        name:
          type: string
        event_id:
          type: integer
          format: int32
    CarBookingDto:
      type: object
      required:
      - id
      - driver_name
      - starts_at
      - ends_at
      - paid_for_fuel
      - created_at
      - status
      properties:
        id:
          type: integer
          format: int32
        driver_name:
          type: string
        starts_at:
          type: string
        ends_at:
          type: string
        miles:
          type: integer
          format: int32
        paid_for_fuel:
          type: boolean
        fuel_cost:
          type: number
          format: double
        trip_note:
          type: string
        completed_at:
          type: string
        created_at:
          type: string
        status:
          type: string
          description: 'One of: upcoming, active, awaiting_completion, completed'
    CarErrorMessage:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ChatDto:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ChatInput:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    CompleteBookingInput:
      type: object
      required:
      - miles
      - paid_for_fuel
      properties:
        miles:
          type: integer
          format: int32
        paid_for_fuel:
          type: boolean
        fuel_cost:
          type: number
          format: double
        trip_note:
          type: string
    CreateBookingInput:
      type: object
      required:
      - driver_name
      - starts_at
      - ends_at
      properties:
        driver_name:
          type: string
        starts_at:
          type: string
        ends_at:
          type: string
    CreateEventInput:
      type: object
      required:
      - name
      - location
      - description
      - starts_at
      - ends_at
      - image_id
      properties:
        name:
          type: string
        location:
          type: string
        description:
          type: string
        starts_at:
          type: string
        ends_at:
          type: string
        image_id:
          type: integer
          format: int32
    ErrorMessage:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    EventDto:
      type: object
      required:
      - id
      - name
      - location
      - description
      - starts_at
      - ends_at
      - attendees
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        location:
          type: string
        description:
          type: string
        starts_at:
          type: string
        ends_at:
          type: string
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/Attendee'
        upload_key:
          type: string
    Housemate:
      type: string
      enum:
      - Luke
      - Jonny
      - George
      - Fraser
    InputModel:
      type: object
      required:
      - name
      - title
      - description
      - stars
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        stars:
          type: integer
          format: int32
    PresignedLinkDto:
      type: object
      required:
      - presigned_link
      properties:
        presigned_link:
          type: string
    Review:
      type: object
      required:
      - id
      - name
      - title
      - description
      - stars
      - is_archived
      - created_at
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        title:
          type: string
        description:
          type: string
        stars:
          type: integer
          format: int32
        is_archived:
          type: boolean
        created_at:
          type: string
          format: naive-date-time
    SendNotificationRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    SuccessMessage:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    UploadImageDto:
      type: object
      required:
      - image_id
      properties:
        image_id:
          type: integer
          format: int32
